name: study_mate
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  loading_animation_widget: ^1.3.0
  icons_plus: ^5.0.0
  fl_chart: ^1.2.0
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  phosphor_flutter: ^2.1.0
  lucide_icons_flutter: ^3.1.14+2
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/profile_pic_girl.png

  fonts:
    - family: Alice
      fonts:
        - asset: assets/fonts/Alice-Regular.ttf

    - family: Lobster
      fonts:
        - asset: assets/fonts/Lobster-Regular.ttf

    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Medium.ttf

    - family: PermanentMarker
      fonts:
        - asset: assets/fonts/PermanentMarker-Regular.ttf

    - family: Bangers
      fonts:
        - asset: assets/fonts/Bangers-Regular.ttf

    - family: Concert-One
      fonts:
        - asset: assets/fonts/ConcertOne-Regular.ttf

    - family: Edu-SA-Hand
      fonts:
        - asset: assets/fonts/EduSAHand-Regular.ttf
          weight: 400

        - asset: assets/fonts/EduSAHand-Bold.ttf
          weight: 700

    - family: Pacifico
      fonts:
        - asset: assets/fonts/Pacifico-Regular.ttf

    - family: Lobster-Two
      fonts:
        - asset: assets/fonts/LobsterTwo-Regular.ttf

    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/Inter_18pt-ExtraLight.ttf
          weight: 200

        - asset: assets/fonts/Inter/Inter_18pt-Black.ttf
          weight: 400

        - asset: assets/fonts/Inter/Inter_18pt-Bold.ttf
          weight: 700

        - asset: assets/fonts/Inter/Inter_18pt-ExtraBold.ttf
          weight: 900

        - asset: assets/fonts/Inter/Inter_18pt-BlackItalic.ttf
          style: italic

    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/Outfit-Black.ttf
          weight: 600
        
        - asset: assets/fonts/Outfit/Outfit-Bold.ttf
          weight: 700

        - asset: assets/fonts/Outfit/Outfit-Regular.ttf
          weight: 400

        - asset: assets/fonts/Outfit/Outfit-SemiBold.ttf
          weight: 500

        - asset: assets/fonts/Outfit/Outfit-Light.ttf
          weight: 200     